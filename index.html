<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>My Elm App</title>
	<style>
		@font-face {
			font-family: 'Dungeon Mode';
			src: url('https://menez.io/css/font/dungeon-mode.ttf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}

		body {
			background: #191970;
			color: #f8f8ff;
			font-family: 'Dungeon Mode', sans-serif;
			text-align: center;
			font-size: 24px;

			/* other shite */
			/* font-size: 1.25rem; */
			/* margin: 0; */
			/* padding: 1rem; */
			text-rendering: optimizeLegibility;
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale;
			font-smooth: always;
		}

		input {
			width: 50%;
			font-family: "Dungeon Mode", sans-serif;
		}

		/* input::placeholder {
			font-family: "Dungeon Mode", sans-serif;
		} */
	</style>
</head>

<body>
	<!-- Load the compiled Elm code -->
	<div id="elm-app"></div>
	<script src="rog.js"></script>
	<script>
		// Initialize your Elm application
		Elm.Rog.init({ node: document.getElementById('elm-app') });
	</script>


</body>

</html>
