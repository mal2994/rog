<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>My Elm App</title>
	<style>
		@font-face {
			font-family: 'Dungeon Mode';
			src: url('https://menez.io/css/font/dungeon-mode.ttf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}

		body {
			background: #191970;
			color: #f8f8ff;
			font-family: 'Dungeon Mode', sans-serif;
			text-align: center;
			font-size: 24px;

			/* other shite */
			/* font-size: 1.25rem; */
			/* margin: 0; */
			/* padding: 1rem; */
			text-rendering: optimizeLegibility;
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale;
			font-smooth: always;

			white-space: pre-line;
		}

		input {
			width: 50%;
			font-family: "Dungeon Mode", sans-serif;
		}

		/* input::placeholder {
			font-family: "Dungeon Mode", sans-serif;
		} */
	</style>
</head>

<body>
	<!-- Load the compiled Elm code -->
	<div id="elm-app"></div>
	<script src="rog.js"></script>
	<script>
		// Initialize your Elm application
		Elm.Main.init({ node: document.getElementById('elm-app') });

		// Listen for any key pressed on the document
		document.addEventListener('keydown', function (event) {
			const inputField = document.getElementById('interpreter-input');

			// 1. Check if the user is already focused on the input field
			if (document.activeElement === inputField) {
				return;
			}

			// 2. Ignore system, navigation, or control keys (like Ctrl, Alt, Shift, Escape, Arrow keys)
			if (event.key.length > 1) {
				return;
			}

			// 3. Move focus to the input field immediately
			inputField.focus();

			// 4. (Optional) Append the typed character so the first letter isn't lost
			// inputField.value += event.key;

			// Prevent the browser from duplicating the key in the input
			// event.preventDefault();
		})
	</script>


</body>

</html>
