<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport"
		content="width=device-width, initial-scale=2, maximum-scale=2, minimum-scale=2, user-scalable=no">
	<title>Dungeon</title>
	<style>
		@font-face {
			font-family: 'Dungeon Mode';
			src: url('https://menez.io/css/font/dungeon-mode.ttf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}

		body {
			background: #191970;
			color: #f8f8ff;
			font-family: 'Dungeon Mode', sans-serif;
			text-align: center;
			/* 
			height: 100vh;
			overflow: hidden;
			overscroll-behavior: none; */

			/* text-rendering: optimizeLegibility;
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale;
			font-smooth: always; */

			white-space: pre-line;
		}

		input {
			/* width: 50%; */
			/* field-sizing: content; */
			font-family: "Dungeon Mode", sans-serif;
			/* font-size: 32px; */
			font-size: 4vw;
			-touch-action: manipulation;
		}

		/* elm generated element */
		#elm-app #world-paragraph {
			font-size: 4vw;
		}
	</style>
</head>

<body>
	<!-- Load the compiled Elm code -->
	<div id="elm-container">
		<div id="elm-app"></div>
	</div>

	<script src="rog.js"></script>
	<script>
		// Initialize your Elm application
		Elm.Main.init({ node: document.getElementById('elm-app') });

		// Listen for any key pressed on the document
		document.addEventListener('keydown', function (event) {
			const inputField = document.getElementById('interpreter-input');

			// 1. Check if the user is already focused on the input field
			if (document.activeElement === inputField) {
				return;
			}

			// 2. Ignore system, navigation, or control keys (like Ctrl, Alt, Shift, Escape, Arrow keys)
			if (event.key.length > 1) {
				return;
			}

			// 3. Move focus to the input field immediately
			inputField.focus();

			// 4. (Optional) Append the typed character so the first letter isn't lost
			// inputField.value += event.key;

			// Prevent the browser from duplicating the key in the input
			// event.preventDefault();
		})
	</script>
</body>

</html>
